
name: Rename CAT folders

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rename CAT folders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path(".")
          changes = []

          for folder in root.rglob("*"):
              if not folder.is_dir():
                  continue

              match = re.fullmatch(
                  r"CAT\s*-\s*(\d+)",
                  folder.name,
                  re.IGNORECASE
              )

              if not match:
                  continue

              number = int(match.group(1))
              if not 1 <= number <= 14:
                  continue

              target = folder.with_name(f"CAT{number}")

              if target.exists():
                  raise SystemExit(
                      f"Target already exists: {target}"
                  )

              changes.append((folder, target))

          changes.sort(
              key=lambda pair: len(pair[0].parts),
              reverse=True
          )

          if not changes:
              print("No matching CAT folders found.")

          for old, new in changes:
              subprocess.run(
                  ["git", "mv", str(old), str(new)],
                  check=True
              )
              print(f"Renamed: {old} -> {new}")
          PY

      - name: Create pull request for review
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Rename CAT folders"
          branch: automation/rename-cat-folders
          delete-branch: true
          title: "Rename CAT folders to CAT-number format"
          body: |
            Renames CAT-1 through CAT-14 to CAT1 through CAT14.
            All existing file contents should remain unchanged.
            Review the changes before merging.
